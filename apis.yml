  description: >-
    The OneDrive File Picker is a JavaScript SDK that provides a pre-built UI component for selecting
    files from OneDrive within web applications. It handles authentication, file browsing, and selection,
    returning file metadata and download URLs to the calling application without requiring direct API
    integration.
